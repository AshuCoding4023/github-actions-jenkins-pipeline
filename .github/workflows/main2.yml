name: Jenkins Replica Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test:

    runs-on: ubuntu-latest

    steps:

      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Build
      - name: Build Project
        run: mvn clean compile

      # Test
      - name: Run Tests
        run: mvn test

      # Finish
      - name: Pipeline Completed
        run: echo "Pipeline completed successfully!"
